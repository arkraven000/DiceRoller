name: Build and Test

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

# Prevent concurrent runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Setup .NET Environment
      uses: ./.github/actions/setup-dotnet-environment
      with:
        dotnet-version: '8.0.x'
        fetch-depth: 0  # Full history for SourceLink

    - name: Build solution
      run: dotnet build --configuration Release --no-restore /p:TreatWarningsAsErrors=true

    - name: Run unit tests
      run: dotnet test --configuration Release --no-build --verbosity normal --logger trx --collect:"XPlat Code Coverage" --results-directory ./TestResults

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action/composite@v2
      if: always()
      with:
        files: 'TestResults/**/*.trx'

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: build-artifacts
        path: |
          src/DiceRoller.App/bin/Release/
          !src/DiceRoller.App/bin/Release/**/*.pdb
        retention-days: 7

    - name: Upload test coverage
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: coverage-results
        path: TestResults/**/coverage.cobertura.xml
        retention-days: 7

    - name: Build summary
      if: always()
      run: |
        echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Configuration: Release" >> $GITHUB_STEP_SUMMARY
        echo "- Target Framework: net8.0-windows10.0.22621.0" >> $GITHUB_STEP_SUMMARY
        echo "- Warnings as Errors: Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- Code Analysis: Enabled" >> $GITHUB_STEP_SUMMARY
